spring:
  datasource:
    url: jdbc:h2:mem:template_test;MODE=Oracle;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    show-sql: false
  flyway:
    clean-disabled: false
    locations: classpath:db/migration/h2

app:
  security:
    jwt:
      secret: dGVzdC1vbmx5LXNlY3JldC1rZXktbXVzdC1iZS1hdC1sZWFzdC0zMi1ieXRlcy1sb25n
      access-token-expiration: 5m
      refresh-token-expiration: 1h
      issuer: template-backend-test
    cors:
      allowed-origins:
        - http://localhost
  bootstrap:
    admin:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.example.template: INFO
